# Define o formato do robô para ele não bater
footprint: [[0.12, 0.15], [0.12, -0.15], [-0.45, -0.15], [-0.45, 0.15]]
# footprint_padding: 0.01

robot_base_frame: base_footprint
update_frequency: 5.0
publish_frequency: 5.0
transform_tolerance: 1.2

# Camada de Obstáculos (O que o Lidar vê)
obstacle_layer:
  enabled: true
  obstacle_range: 2.5  # Só considera obstáculo se estiver a menos de 2.5m
  raytrace_range: 3.0  # Limpa o mapa se o laser passar e não bater em nada até 3m
  inflation_radius: 0.2
  track_unknown_space: true
  observation_sources: laser_scan_sensor
  laser_scan_sensor: 
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    min_obstacle_height: 0.01
    max_obstacle_height: 2.5
    inf_is_valid: true

# Camada de Inflação (Zona de segurança ao redor dos obstáculos)
inflation_layer:
  enabled: true
  cost_scaling_factor: 5.0  # Quanto maior, mais rápido o custo cai (permite passar mais perto)
  inflation_radius: 0.5     # Raio total de influência do obstáculo